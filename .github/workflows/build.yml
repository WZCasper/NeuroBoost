name: Build NeuroBoost installer

# Runs on GitHub's own Windows machine — you never need a terminal or a PC
# of your own. Trigger it by pushing to main, or manually from the Actions
# tab (works fine from the GitHub mobile app / mobile browser too).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# One build at a time. Two overlapping runs would race on the version number
# (derived from the run number) and on the push of the build log. Runs are
# queued rather than cancelled so a half-finished release is never abandoned.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # electron-updater compares the app's *version*, not the release tag,
      # so a fixed 1.0.0 in package.json would mean no build is ever seen as
      # newer. Derive the patch number from the CI run number instead.
      - name: Set build version
        shell: pwsh
        run: |
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Building version $version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run JavaScript unit tests
        shell: cmd
        run: |
          npm test > build-output.log 2>&1
          type build-output.log
          exit /b %errorlevel%

      - name: Run PowerShell (Pester) tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Invoke-Pester -Path ./test -CI -Output Detailed

      - name: Build the Windows installer
        shell: cmd
        run: |
          npm run dist > build-output.log 2>&1
          exit /b %errorlevel%

      # Releases and the log push are for main only. This workflow can also be
      # started by hand on any branch; without this guard such a run would
      # publish a public release from unreviewed code and `git push origin
      # HEAD:main` would move main to that branch.
      - name: Publish installer as a GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem dist/NeuroBoost-Setup-*.exe | Select-Object -First 1
          # latest.yml is what electron-updater actually reads to discover a
          # new version; publishing only the .exe would leave auto-update
          # permanently blind. The .blockmap enables differential downloads.
          $assets = @($exe.FullName)
          foreach ($extra in @('dist/latest.yml', "$($exe.FullName).blockmap")) {
            if (Test-Path $extra) { $assets += (Resolve-Path $extra).Path }
          }
          $tag = "v$($env:APP_VERSION)"
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title "NeuroBoost $($env:APP_VERSION)" --notes "Automated build from commit $($env:GITHUB_SHA)"

      # Workflow artifacts live on Azure blob storage which isn't reachable
      # from every environment, so the build log is also committed straight
      # into the repo — always readable as a plain file.
      - name: Publish build log
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "neuroboost-ci"
          git config user.email "ci@neuroboost.local"
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          if (Test-Path build-output.log) {
            Copy-Item build-output.log .ci/last-build.log -Force
          } else {
            "No build-output.log was produced by this run." | Out-File -FilePath .ci/last-build.log -Encoding utf8
          }
          git add -f .ci/last-build.log
          git commit -m "ci: update last build log [skip ci]" --allow-empty
          # main may have moved while this build ran; rebase onto it and retry
          # instead of failing on a non-fast-forward push.
          $pushed = $false
          foreach ($attempt in 1..3) {
            # --autostash: `npm version` leaves package.json modified in this
            # workspace, and git refuses to rebase over unstaged changes.
            git pull --rebase --autostash origin main
            if ($LASTEXITCODE -ne 0) {
              # Never push from a half-finished rebase; back out and retry.
              git rebase --abort 2>$null
              Write-Host "log rebase attempt $attempt failed (exit $LASTEXITCODE), retrying"
              Start-Sleep -Seconds (3 * $attempt)
              continue
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "log push attempt $attempt failed (exit $LASTEXITCODE), retrying"
            Start-Sleep -Seconds (3 * $attempt)
          }
          if (-not $pushed) {
            # The log is a diagnostic convenience: losing it must not fail an
            # otherwise good build, but it must not vanish silently either.
            Write-Host "::warning::Could not push .ci/last-build.log after 3 attempts"
          }
