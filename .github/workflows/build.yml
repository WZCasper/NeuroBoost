name: Build NeuroBoost installer

# Runs on GitHub's own Windows machine — you never need a terminal or a PC
# of your own. Trigger it by pushing to main, or manually from the Actions
# tab (works fine from the GitHub mobile app / mobile browser too).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer
        run: npm run dist

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBoost-Setup
          path: dist/NeuroBoost-Setup-*.exe
          if-no-files-found: error
