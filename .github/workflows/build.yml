name: Build NeuroBoost installer

# Runs on GitHub's own Windows machine — you never need a terminal or a PC
# of your own. Trigger it by pushing to main, or manually from the Actions
# tab (works fine from the GitHub mobile app / mobile browser too).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # electron-updater compares the app's *version*, not the release tag,
      # so a fixed 1.0.0 in package.json would mean no build is ever seen as
      # newer. Derive the patch number from the CI run number instead.
      - name: Set build version
        shell: pwsh
        run: |
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Building version $version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run JavaScript unit tests
        shell: cmd
        run: |
          npm test > build-output.log 2>&1
          type build-output.log
          exit /b %errorlevel%

      - name: Run PowerShell (Pester) tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Invoke-Pester -Path ./test -CI -Output Detailed

      - name: Build the Windows installer
        shell: cmd
        run: |
          npm run dist > build-output.log 2>&1
          exit /b %errorlevel%

      - name: Publish installer as a GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem dist/NeuroBoost-Setup-*.exe | Select-Object -First 1
          # latest.yml is what electron-updater actually reads to discover a
          # new version; publishing only the .exe would leave auto-update
          # permanently blind. The .blockmap enables differential downloads.
          $assets = @($exe.FullName)
          foreach ($extra in @('dist/latest.yml', "$($exe.FullName).blockmap")) {
            if (Test-Path $extra) { $assets += (Resolve-Path $extra).Path }
          }
          $tag = "v$($env:APP_VERSION)"
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title "NeuroBoost $($env:APP_VERSION)" --notes "Automated build from commit $($env:GITHUB_SHA)"

      # Workflow artifacts live on Azure blob storage which isn't reachable
      # from every environment, so the build log is also committed straight
      # into the repo — always readable as a plain file.
      - name: Publish build log
        if: always()
        shell: pwsh
        run: |
          git config user.name "neuroboost-ci"
          git config user.email "ci@neuroboost.local"
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          if (Test-Path build-output.log) {
            Copy-Item build-output.log .ci/last-build.log -Force
          } else {
            "No build-output.log was produced by this run." | Out-File -FilePath .ci/last-build.log -Encoding utf8
          }
          git add -f .ci/last-build.log
          git commit -m "ci: update last build log [skip ci]" --allow-empty
          git push origin HEAD:main
          Write-Host "log push exit code: $LASTEXITCODE"
