name: Tests

# Runs the JavaScript and PowerShell tests on GitHub's Windows machine for
# every pull request, so a change shows green or red BEFORE it reaches main.
# It only reads the code: it never builds an installer, creates a release or
# pushes anything (that is build.yml's job, and only on main).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm test

      # The app launches powershell.exe (Windows PowerShell 5.1), which reads a
      # BOM-less script using the system codepage. Every script must therefore
      # parse under 5.1 and stay plain ASCII (see README, "plain ASCII on
      # purpose"). `shell: powershell` is 5.1; `pwsh` would be PowerShell 7.
      - name: Check PowerShell scripts (parse under 5.1, ASCII only)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path resources/scripts, test -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
          }
          Get-ChildItem -Path resources/scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($null -ne ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1)) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::Contains non-ASCII characters"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All PowerShell scripts parse and are ASCII."

      - name: Run PowerShell (Pester) tests
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Invoke-Pester -Path ./test -CI -Output Detailed
